<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | KrishiSetu</title>
  <link rel="stylesheet" href="static/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="static/img/logo.svg">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">
        <img src="static/img/logo.svg" alt="KrishiSetu Logo" class="brand-logo">
        <div class="brand-text">
          <span class="brand-title">KrishiSetu</span>
          <span class="brand-subtitle">Login</span>
        </div>
      </a>
      <div class="header-actions">
        <button id="lang-toggle-btn" class="lang-toggle-btn" type="button">🌐 മലയാളം</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="max-width: 440px;">
      <div class="surface-card" style="padding: 30px 24px;">
        <h2 style="font-size: 1.6rem; font-weight: 700; color: var(--dark-green); margin-bottom: 6px; text-align: center;">Welcome Back</h2>
        <p style="font-size: 0.9rem; color: var(--text-muted); text-align: center; margin-bottom: 24px;">Log in to access your farm portal or buyer marketplace</p>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-phone">Mobile Phone Number</label>
            <input type="tel" id="login-phone" name="phone" class="form-control" placeholder="e.g. 9876543210" inputmode="numeric" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" name="password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" id="login-btn" class="btn btn-primary btn-block" style="margin-top: 20px;">
            <span>Sign In →</span>
          </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
          Don't have an account? <a href="register.html" style="font-weight: 600;">Register here</a>
        </div>

        <div style="margin-top: 24px; padding-top: 16px; border-top: 1px dashed var(--card-border); font-size: 0.8rem; color: var(--text-muted); text-align: center;">
          💡 <strong>Demo Quick Fill:</strong><br>
          <button type="button" class="btn btn-outline btn-sm" style="margin: 6px 4px;" onclick="quickFill('9876543210', 'farmer123', 'farmer')">Farmer Demo</button>
          <button type="button" class="btn btn-outline btn-sm" style="margin: 6px 4px;" onclick="quickFill('9876543211', 'buyer123', 'buyer')">Buyer Demo</button>
        </div>
      </div>
    </div>
  </main>

  <script src="static/js/common.js"></script>
  <script>
    function quickFill(phone, pwd, role) {
      document.getElementById('login-phone').value = phone;
      document.getElementById('login-password').value = pwd;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('login-phone').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.textContent = "Signing In...";

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          localStorage.setItem('krishi_user', JSON.stringify(data.user));
          showToast(`Welcome, ${data.user.name}!`, 'success');
          setTimeout(() => {
            window.location.href = data.user.role === 'buyer' ? 'templates/buyer/home.html' : 'templates/farmer/dashboard.html';
          }, 500);
        } else {
          // Fallback simulation for offline demo
          simulateLocalLogin(phone);
        }
      } catch (err) {
        simulateLocalLogin(phone);
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In →";
      }
    });

    function simulateLocalLogin(phone) {
      const isBuyer = phone.endsWith('1');
      const mockUser = {
        id: isBuyer ? 2 : 1,
        name: isBuyer ? "Suresh Kumar (Buyer)" : "Rajan Pillai (Farmer)",
        role: isBuyer ? "buyer" : "farmer",
        phone: phone,
        district: "Ernakulam"
      };
      localStorage.setItem('krishi_user', JSON.stringify(mockUser));
      showToast(`Logged in as ${mockUser.name}`, 'success');
      setTimeout(() => {
        window.location.href = mockUser.role === 'buyer' ? 'templates/buyer/home.html' : 'templates/farmer/dashboard.html';
      }, 500);
    }
  </script>
</body>
</html>
