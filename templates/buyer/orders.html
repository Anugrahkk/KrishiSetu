<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyer Orders | KrishiSetu</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container">
      <a href="/buyer" class="brand">
        <img src="/static/img/logo.svg" alt="KrishiSetu Logo" class="brand-logo">
        <div class="brand-text">
          <span class="brand-title">KrishiSetu</span>
          <span class="brand-subtitle">Buyer Orders 📦</span>
        </div>
      </a>
      <nav class="header-nav">
        <a href="/buyer" data-i18n="home">Home</a>
        <a href="/buyer/produce">Fresh Produce</a>
        <a href="/buyer/cart" data-i18n="cart">Cart</a>
        <a href="/buyer/orders" class="active" data-i18n="orders">Orders</a>
      </nav>
      <div class="header-actions">
        <button id="lang-toggle-btn" class="lang-toggle-btn" type="button">🌐 മലയാളം</button>
        <a href="/buyer/cart" class="cart-icon-btn" title="View Cart">
          <span>🛒</span>
          <span class="cart-counter" style="display: none;">0</span>
        </a>
        <div id="header-user-slot"></div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container" style="max-width: 760px;">

      <div style="margin-bottom: 24px;">
        <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--dark-green); margin-bottom: 6px;">
          📦 My Produce Orders
        </h1>
        <p style="font-size: 0.95rem; color: var(--text-muted);">
          Track your farm-direct produce orders and delivery status.
        </p>
      </div>

      <div id="buyer-orders-list"></div>

    </div>
  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="/buyer" class="bottom-nav-item">
      <span class="nav-icon">🏠</span>
      <span data-i18n="home">Home</span>
    </a>
    <a href="/buyer/produce" class="bottom-nav-item">
      <span class="nav-icon">🌾</span>
      <span>Browse</span>
    </a>
    <a href="/buyer/cart" class="bottom-nav-item">
      <span class="nav-icon">🛒</span>
      <span data-i18n="cart">Cart</span>
    </a>
    <a href="/buyer/orders" class="bottom-nav-item active" style="color: var(--primary-green); font-weight: 800;">
      <span class="nav-icon">📦</span>
      <span data-i18n="orders">Orders</span>
    </a>
  </nav>

  <!-- Scripts -->
  <script src="/static/js/common.js"></script>
  <script src="/static/js/cart.js"></script>
  <script src="/static/js/buyer.js"></script>
</body>
</html>
