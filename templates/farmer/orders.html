<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | KrishiSetu</title>
  <link rel="stylesheet" href="../../static/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="../../static/img/logo.svg">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container">
      <a href="dashboard.html" class="brand">
        <img src="../../static/img/logo.svg" alt="KrishiSetu Logo" class="brand-logo">
        <div class="brand-text">
          <span class="brand-title">KrishiSetu</span>
          <span class="brand-subtitle">Order History 📦</span>
        </div>
      </a>
      <nav class="header-nav">
        <a href="dashboard.html" data-i18n="home">Home</a>
        <a href="doctor.html" data-i18n="cropDoctor">Crop Doctor</a>
        <a href="inputs.html" data-i18n="buyInputs">Buy Inputs</a>
        <a href="cart.html" data-i18n="cart">Cart</a>
        <a href="orders.html" class="active" data-i18n="orders">Orders</a>
        <a href="sell.html" data-i18n="sellProduce">Sell</a>
        <a href="vets.html" data-i18n="findVet">Vets</a>
      </nav>
      <div class="header-actions">
        <button id="lang-toggle-btn" class="lang-toggle-btn" type="button">🌐 മലയാളം</button>
        <a href="cart.html" class="cart-icon-btn" title="View Cart">
          <span>🛒</span>
          <span class="cart-counter" style="display: none;">0</span>
        </a>
        <div id="header-user-slot"></div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container" style="max-width: 760px;">

      <!-- Sequential Flow Steps Tracker -->
      <div class="flow-steps">
        <a href="inputs.html" class="flow-step completed">
          <span class="flow-step-num">✓</span>
          <span>1. Inputs Selected</span>
        </a>
        <span class="flow-step-arrow">➔</span>
        <a href="cart.html" class="flow-step completed">
          <span class="flow-step-num">✓</span>
          <span>2. Cart & Billing</span>
        </a>
        <span class="flow-step-arrow">➔</span>
        <div class="flow-step active">
          <span class="flow-step-num">3</span>
          <span>3. Order Placed & Tracking</span>
        </div>
      </div>

      <div style="margin-bottom: 24px;">
        <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--dark-green); margin-bottom: 6px;">
          📦 My Order History
        </h1>
        <p style="font-size: 0.95rem; color: var(--text-muted);">
          Track your input bookings and delivery progress.
        </p>
      </div>

      <div id="farmer-orders-list"></div>

    </div>
  </main>

  <!-- Mobile Bottom Navigation (5 icons) -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="bottom-nav-item">
      <span class="nav-icon">🏠</span>
      <span data-i18n="home">Home</span>
    </a>
    <a href="doctor.html" class="bottom-nav-item">
      <span class="nav-icon">🩺</span>
      <span data-i18n="cropDoctor">Doctor</span>
    </a>
    <a href="inputs.html" class="bottom-nav-item">
      <span class="nav-icon">🌱</span>
      <span data-i18n="buyInputs">Inputs</span>
    </a>
    <a href="cart.html" class="bottom-nav-item">
      <span class="nav-icon">🛒</span>
      <span data-i18n="cart">Cart</span>
    </a>
    <a href="orders.html" class="bottom-nav-item active" style="color: var(--primary-green); font-weight: 800;">
      <span class="nav-icon">📦</span>
      <span data-i18n="orders">Orders</span>
    </a>
  </nav>

  <!-- Scripts -->
  <script src="../../static/js/common.js"></script>
  <script src="../../static/js/cart.js"></script>
  <script src="../../static/js/farmer.js"></script>
</body>
</html>
