<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veterinary Doctor Directory | KrishiSetu</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container">
      <a href="/farmer" class="brand">
        <img src="/static/img/logo.svg" alt="KrishiSetu Logo" class="brand-logo">
        <div class="brand-text">
          <span class="brand-title">KrishiSetu</span>
          <span class="brand-subtitle">Vet Directory 🩺</span>
        </div>
      </a>
      <nav class="header-nav">
        <a href="/farmer" data-i18n="home">Home</a>
        <a href="/farmer/inputs" data-i18n="buyInputs">Buy Inputs</a>
        <a href="/farmer/doctor" data-i18n="cropDoctor">Crop Doctor</a>
        <a href="/farmer/sell" data-i18n="sellProduce">Sell</a>
        <a href="/farmer/vets" class="active" data-i18n="findVet">Vets</a>
        <a href="/farmer/orders" data-i18n="orders">Orders</a>
      </nav>
      <div class="header-actions">
        <button id="lang-toggle-btn" class="lang-toggle-btn" type="button">🌐 മലയാളം</button>
        <a href="/farmer/cart" class="cart-icon-btn" title="View Cart">
          <span>🛒</span>
          <span class="cart-counter" style="display: none;">0</span>
        </a>
        <div id="header-user-slot"></div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">

      <!-- Header -->
      <div style="margin-bottom: 20px;">
        <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--dark-green); margin-bottom: 6px;">
          🩺 Veterinary Doctor Directory
        </h1>
        <p style="font-size: 0.95rem; color: var(--text-muted);">
          Instant access to certified government and local veterinary doctors for poultry, dairy cows, and goats.
        </p>
      </div>

      <!-- Filters Bar -->
      <div class="filters-bar">
        <div class="filter-row">
          <div class="filter-chips">
            <button type="button" class="chip-btn vet-chip active" data-specialty="">All Specialties</button>
            <button type="button" class="chip-btn vet-chip" data-specialty="dairy">🐄 Dairy & Cattle</button>
            <button type="button" class="chip-btn vet-chip" data-specialty="poultry">🐔 Poultry</button>
            <button type="button" class="chip-btn vet-chip" data-specialty="goat">🐐 Goat Care</button>
            <button type="button" class="chip-btn vet-chip" data-specialty="general">🩺 General Veterinary</button>
          </div>
        </div>

        <div class="filter-row" style="margin-top: 12px;">
          <div class="search-input-wrap">
            <input type="text" id="vet-search" class="form-control" placeholder="🔍 Search doctor name or clinic...">
          </div>

          <select id="vet-district-filter" class="select-control">
            <option value="">📍 All Districts</option>
            <option value="Ernakulam">Ernakulam</option>
            <option value="Thrissur">Thrissur</option>
            <option value="Kottayam">Kottayam</option>
            <option value="Idukki">Idukki</option>
            <option value="Palakkad">Palakkad</option>
          </select>
        </div>
      </div>

      <!-- Vets Grid -->
      <div id="vets-grid" class="vet-grid"></div>

    </div>
  </main>

  <!-- Mobile Bottom Navigation (5 icons) -->
  <nav class="bottom-nav">
    <a href="/farmer" class="bottom-nav-item">
      <span class="nav-icon">🏠</span>
      <span data-i18n="home">Home</span>
    </a>
    <a href="/farmer/inputs" class="bottom-nav-item">
      <span class="nav-icon">🌱</span>
      <span data-i18n="buyInputs">Inputs</span>
    </a>
    <a href="/farmer/doctor" class="bottom-nav-item">
      <span class="nav-icon">🩺</span>
      <span data-i18n="cropDoctor">Doctor</span>
    </a>
    <a href="/farmer/sell" class="bottom-nav-item">
      <span class="nav-icon">🌾</span>
      <span data-i18n="sellProduce">Sell</span>
    </a>
    <a href="/farmer/vets" class="bottom-nav-item active" style="color: var(--primary-green); font-weight: 800;">
      <span class="nav-icon">📞</span>
      <span data-i18n="findVet">Vets</span>
    </a>
  </nav>

  <!-- Scripts -->
  <script src="/static/js/common.js"></script>
  <script src="/static/js/cart.js"></script>
  <script src="/static/js/farmer.js"></script>
</body>
</html>
