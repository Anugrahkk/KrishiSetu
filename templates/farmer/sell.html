<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell Produce Direct | KrishiSetu</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container">
      <a href="/farmer" class="brand">
        <img src="/static/img/logo.svg" alt="KrishiSetu Logo" class="brand-logo">
        <div class="brand-text">
          <span class="brand-title">KrishiSetu</span>
          <span class="brand-subtitle">Sell Produce 🌾</span>
        </div>
      </a>
      <nav class="header-nav">
        <a href="/farmer" data-i18n="home">Home</a>
        <a href="/farmer/doctor" data-i18n="cropDoctor">Crop Doctor</a>
        <a href="/farmer/inputs" data-i18n="buyInputs">Buy Inputs</a>
        <a href="/farmer/cart" data-i18n="cart">Cart</a>
        <a href="/farmer/orders" data-i18n="orders">Orders</a>
        <a href="/farmer/sell" class="active" data-i18n="sellProduce">Sell</a>
        <a href="/farmer/vets" data-i18n="findVet">Vets</a>
      </nav>
      <div class="header-actions">
        <button id="lang-toggle-btn" class="lang-toggle-btn" type="button">🌐 മലയാളം</button>
        <a href="/farmer/cart" class="cart-icon-btn" title="View Cart">
          <span>🛒</span>
          <span class="cart-counter" style="display: none;">0</span>
        </a>
        <div id="header-user-slot"></div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container" style="max-width: 800px;">

      <!-- Header with Action Button -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
        <div>
          <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--dark-green); margin-bottom: 4px;">
            🌾 Direct Harvest Marketplace
          </h1>
          <p style="font-size: 0.95rem; color: var(--text-muted);">
            Sell directly to consumers without paying 20–40% middlemen commissions.
          </p>
        </div>
        <button type="button" class="btn btn-primary" onclick="toggleProduceModal(true)">
          <span>➕ Add New Harvest Listing</span>
        </button>
      </div>

      <!-- My Active Listings -->
      <div class="surface-card">
        <h2 style="font-size: 1.15rem; font-weight: 700; color: var(--text-dark); margin-bottom: 16px;">
          📋 My Current Produce Listings
        </h2>
        <div id="my-produce-list"></div>
      </div>

    </div>
  </main>

  <!-- Modal for Adding New Produce -->
  <div id="add-produce-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">🌾 List Your Harvest</h3>
        <button type="button" class="modal-close" onclick="toggleProduceModal(false)">×</button>
      </div>

      <form id="add-produce-form">
        <div class="form-group">
          <label class="form-label" for="prod-category">Produce Category</label>
          <select id="prod-category" name="category" class="form-control" required>
            <option value="vegetable">Vegetables (പച്ചക്കറികൾ)</option>
            <option value="fruit">Fruits (പഴങ്ങൾ)</option>
            <option value="crop">Crops & Tubers (നെല്ല്, കപ്പ)</option>
            <option value="egg">Country Eggs (നാടൻ മുട്ട)</option>
            <option value="milk">Dairy / Cow Milk (പശുവിൻ പാൽ)</option>
            <option value="other">Spices / Honey (കുരുമുളക്, തേൻ)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="prod-name">Produce Name</label>
          <input type="text" id="prod-name" name="name" class="form-control" placeholder="e.g. Organic Nendran Bananas" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label" for="prod-price">Price (₹)</label>
            <input type="number" id="prod-price" name="price" class="form-control" placeholder="50" min="1" step="0.5" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="prod-unit">Unit</label>
            <select id="prod-unit" name="unit" class="form-control" required>
              <option value="kg">per kg</option>
              <option value="dozen">per dozen</option>
              <option value="piece">per piece</option>
              <option value="litre">per litre</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label" for="prod-quantity">Quantity Available</label>
            <input type="number" id="prod-quantity" name="quantity" class="form-control" placeholder="100" min="1" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="prod-district">Farm District</label>
            <select id="prod-district" name="district" class="form-control" required>
              <option value="Ernakulam">Ernakulam</option>
              <option value="Thrissur">Thrissur</option>
              <option value="Kottayam">Kottayam</option>
              <option value="Idukki">Idukki</option>
              <option value="Palakkad">Palakkad</option>
              <option value="Alappuzha">Alappuzha</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="prod-desc">Description</label>
          <textarea id="prod-desc" name="description" class="form-control" rows="2" placeholder="e.g. Naturally ripened, no chemical spraying. Freshly harvested this morning."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="prod-image">Photo (Optional)</label>
          <input type="file" id="prod-image" name="image" class="form-control" accept="image/*">
        </div>

        <button type="submit" id="save-produce-btn" class="btn btn-primary btn-block" style="margin-top: 12px;">
          <span>Publish Listing</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Mobile Bottom Navigation (5 icons) -->
  <nav class="bottom-nav">
    <a href="/farmer" class="bottom-nav-item">
      <span class="nav-icon">🏠</span>
      <span data-i18n="home">Home</span>
    </a>
    <a href="/farmer/doctor" class="bottom-nav-item">
      <span class="nav-icon">🩺</span>
      <span data-i18n="cropDoctor">Doctor</span>
    </a>
    <a href="/farmer/inputs" class="bottom-nav-item">
      <span class="nav-icon">🌱</span>
      <span data-i18n="buyInputs">Inputs</span>
    </a>
    <a href="/farmer/cart" class="bottom-nav-item">
      <span class="nav-icon">🛒</span>
      <span data-i18n="cart">Cart</span>
    </a>
    <a href="/farmer/orders" class="bottom-nav-item">
      <span class="nav-icon">📦</span>
      <span data-i18n="orders">Orders</span>
    </a>
  </nav>

  <!-- Scripts -->
  <script src="/static/js/common.js"></script>
  <script src="/static/js/cart.js"></script>
  <script src="/static/js/farmer.js"></script>
</body>
</html>
